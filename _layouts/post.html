---
layout: page
---
{% if page.badges %}
  {% for badge in page.badges %}
    <span class="badge badge-{{ badge.type }}">{{ badge.tag }}</span>
  {% endfor %}
{% endif %}
<div class="post-title">{{ page.title }}</div>
<div class="post-content">{{ content | strip_newlines }}</div>
<div class="post-date">{{ page.date | date: "%d.%m.%Y" }}</div>
